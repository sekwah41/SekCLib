plugins {
    id 'earth.terrarium.cloche'
    id 'maven-publish'
}

def branch = System.getenv('GITHUB_REF')?.replace('refs/heads/', '')
def isRelease = System.getenv('IS_RELEASE') == 'true'
def snapshotName = (branch == null || branch.startsWith('release-please')) ? 'SNAPSHOT' : branch
def githubSha = System.getenv('GITHUB_SHA')
def shaRef = githubSha == null ? '' : "-${githubSha.substring(0, 8)}"

group = project.package
version = file('version.txt').text.trim() + (isRelease ? '' : "-${snapshotName}${shaRef}")

base {
    archivesName = project.archive
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    cloche.librariesMinecraft()
    mavenCentral()
    cloche {
        main()
        mavenFabric()
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
}

cloche {
    minecraftVersion = project.minecraft_version

    metadata {
        modId = project.modid
        name = 'SekC Lib'
        description = '''A library mod designed to make aspects of modding easier, in particular network syncing with clients.

Other features and utilities are also included.'''
        license = 'MIT'
        url = 'https://sekclib.sekwah.com/'
        issues = "${project.github}/issues"
        sources = project.github
        author('Sekwah')

        dependency {
            modId = 'minecraft'
            version {
                start = '1.20'
                end = '1.21'
                endExclusive = true
            }
        }
    }

    singleTarget { target ->
        target.fabric { fabric ->
            fabric.loaderVersion = project.fabric_loader_version
            fabric.includedClient()

            fabric.sourceSet.java.setSrcDirs(['common/src/main/java', 'fabric/src/main/java'])
            fabric.sourceSet.resources.setSrcDirs(['common/src/main/resources', 'fabric/src/main/resources'])
            fabric.sourceSet.resources.exclude('fabric.mod.json')
            fabric.withSourcesJar()

            fabric.metadata {
                entrypoint('main', 'com.sekwah.sekclib.SekCLibFabric')
                dependency {
                    modId = 'fabric-api'
                    version {
                        start = project.fabric_version
                    }
                }
                custom('modmenu', [badges: ['library']])
            }

            fabric.dependencies {
                fabricApi(project.fabric_api_version)
                modImplementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"))
                modImplementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"))
                modLocalRuntime('com.terraformersmc:modmenu:7.1.0')
            }

            fabric.runs {
                client()
                server()
            }
        }
    }


}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Ensure Cloche has produced its mapping archive before remapping the common
// Minecraft classes used by the Fabric target.
tasks.matching { it.name == 'accessWidenCommonMinecraft' }.configureEach {
    dependsOn(tasks.named('generateMappingsArtifact'))
}

def prepareFabricGeneratedResources = tasks.register('prepareFabricGeneratedResources') {
    def generatedDirectories = [
        layout.buildDirectory.dir('generated/resources/fabric'),
        layout.buildDirectory.dir('generated/resources/fabricClient')
    ]
    outputs.dirs(generatedDirectories)
    doLast {
        generatedDirectories.each { it.get().asFile.mkdirs() }
    }
}

tasks.matching { it.name.startsWith('prepareRunFabric') }.configureEach {
    dependsOn(prepareFabricGeneratedResources)
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archive}" }
    }
}

publishing {
    publications {
        SekCLib(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = 's3://sekwah-maven/'
            authentication {
                awsIm(AwsImAuthentication)
            }
        }
    }
}

tasks.named('build') {
    dependsOn(':fabric-testmod:build', ':neoforge:build')
}
