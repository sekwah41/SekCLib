plugins {
    id 'earth.terrarium.cloche'
    id 'maven-publish'
}

def branch = System.getenv('GITHUB_REF')?.replace('refs/heads/', '')
def isRelease = System.getenv('IS_RELEASE') == 'true'
def snapshotName = (branch == null || branch.startsWith('release-please')) ? 'SNAPSHOT' : branch
def githubSha = System.getenv('GITHUB_SHA')
def shaRef = githubSha == null ? '' : "-${githubSha.substring(0, 8)}"

group = project.package
version = file('version.txt').text.trim() + (isRelease ? '' : "-${snapshotName}${shaRef}")

base {
    archivesName = project.archive
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    cloche.librariesMinecraft()
    mavenCentral()
    cloche {
        main()
        mavenFabric()
        mavenForge()
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

cloche {
    minecraftVersion = project.minecraft_version

    metadata {
        modId = project.modid
        name = 'SekC Lib'
        description = '''A library mod designed to make aspects of modding easier, in particular network syncing with clients.

Other features and utilities are also included.'''
        license = 'MIT'
        url = 'https://sekclib.sekwah.com/'
        issues = "${project.github}/issues"
        sources = project.github
        author('Sekwah')

        dependency {
            modId = 'minecraft'
            version {
                start = '1.20'
                end = '1.21'
                endExclusive = true
            }
        }
    }

    common {
        sourceSet.java.setSrcDirs(['common/src/main/java'])
        sourceSet.resources.setSrcDirs(['common/src/main/resources'])
        withSourcesJar()
    }

    fabric {
        loaderVersion = project.fabric_loader_version
        includedClient()

        sourceSet.java.setSrcDirs(['fabric/src/main/java'])
        sourceSet.resources.setSrcDirs(['fabric/src/main/resources'])
        sourceSet.resources.exclude('fabric.mod.json')
        withSourcesJar()

        metadata {
            entrypoint('main', 'com.sekwah.sekclib.SekCLibFabric')
            dependency {
                modId = 'fabric-api'
                version {
                    start = project.fabric_version
                }
            }
            custom('modmenu', [badges: ['library']])
        }

        dependencies {
            fabricApi(project.fabric_api_version)
            modLocalRuntime('com.terraformersmc:modmenu:7.1.0')
        }

        runs {
            client()
            server()
        }
    }

    forge {
        loaderVersion = project.forge_version

        // The legacy module is named "neoforge", but contains Forge 1.20.1 code.
        sourceSet.java.setSrcDirs(['neoforge/src/main/java'])
        sourceSet.resources.setSrcDirs(['neoforge/src/main/resources'])
        sourceSet.resources.exclude('META-INF/mods.toml')
        withSourcesJar()

        metadata {
            dependency {
                modId = 'forge'
                version {
                    start = '46.0.1'
                    end = '48'
                    endExclusive = true
                }
            }
        }

        runs {
            client()
            server()
        }
    }
}

// Forge loads fmlloader from its legacy classpath. Cloche 0.19.13 also remaps
// it onto the regular runtime classpath, making ModLauncher resolve it twice.
configurations.named('forgeRuntimeClasspath') {
    exclude group: 'net.minecraftforge', module: 'fmlloader'
}
configurations.named('forgeLegacyClasspath') {
    attributes.attribute(
        org.gradle.api.attributes.Attribute.of('earth.terrarium.cloche.noNameMappingService', Boolean),
        true
    )
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Cloche 0.19.13 does not currently wire its generated mapping archive into
// every Fabric transform task when starting from a clean checkout.
tasks.matching { it.name.startsWith('accessWidenFabric') }.configureEach {
    dependsOn(tasks.named('generateFabricMappingsArtifact'))
}

def prepareFabricGeneratedResources = tasks.register('prepareFabricGeneratedResources') {
    def generatedDirectories = [
        layout.buildDirectory.dir('generated/resources/fabric'),
        layout.buildDirectory.dir('generated/resources/fabricClient')
    ]
    outputs.dirs(generatedDirectories)
    doLast {
        generatedDirectories.each { it.get().asFile.mkdirs() }
    }
}

tasks.matching { it.name.startsWith('prepareRunFabric') }.configureEach {
    dependsOn(prepareFabricGeneratedResources)
}

// Forge 47.4's versioned-jar lookup also matches Cloche's client-extra name.
// Put client-extra after the actual versioned Minecraft/Forge jar so each
// lookup resolves to the intended file.
tasks.named('writeForgeLegacyClasspath') {
    doLast {
        def classpathFile = output.get().asFile
        def entries = classpathFile.readLines()
        def clientExtra = entries.findAll { it.endsWith('-client-extra.jar') }
        classpathFile.text = (entries - clientExtra + clientExtra).join(System.lineSeparator())
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archive}" }
    }
}

publishing {
    publications {
        SekCLib(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = 's3://sekwah-maven/'
            authentication {
                awsIm(AwsImAuthentication)
            }
        }
    }
}

tasks.named('build') {
    dependsOn(':fabric-testmod:build', ':neoforge-testmod:build')
}
