plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    compileOnly project(path: ':', configuration: 'apiElements')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
