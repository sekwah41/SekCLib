plugins {
    id 'earth.terrarium.cloche'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    cloche.librariesMinecraft()
    mavenCentral()
    cloche {
        main()
        mavenFabric()
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

cloche {
    minecraftVersion = project.minecraft_version

    metadata {
        modId = 'sekclibtest'
        name = 'SekC Lib Test Mod'
        description = 'A test mod for SekCLib'
        license = 'MIT'
        url = 'https://sekclib.sekwah.com/'
        issues = "${project.github}/issues"
        sources = project.github
        author('Sekwah')

        dependency {
            modId = 'sekclib'
            version {
                start = '1.0.0'
            }
        }

        dependency {
            modId = 'minecraft'
            version {
                start = '1.20'
                end = '1.21'
                endExclusive = true
            }
        }
    }

    singleTarget { target ->
        target.fabric { fabric ->
            fabric.loaderVersion = project.fabric_loader_version
            fabric.includedClient()

            fabric.sourceSet.java.srcDir(rootProject.file('common-testmod/src/main/java'))
            fabric.sourceSet.resources.srcDir(rootProject.file('common-testmod/src/main/resources'))
            fabric.sourceSet.resources.exclude('fabric.mod.json')
            fabric.sourceSet.resources.exclude('mixins.sekclibtest.json')
            fabric.mixins.from(file('src/main/resources/mixins.sekclibtest.json'))

            fabric.metadata {
                entrypoint('main', 'com.sekwah.sekclibtestmod.SekCLibTest')
                dependency {
                    modId = 'fabric-api'
                    version {
                        start = project.fabric_version
                    }
                }
            }

            fabric.dependencies {
                implementation.add(project(':'))
                fabricApi(project.fabric_api_version)
                modLocalRuntime('com.terraformersmc:modmenu:7.2.2')
            }

            fabric.runs {
                client()
                server()
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.matching { it.name.startsWith('accessWiden') }.configureEach {
    dependsOn(tasks.named('generateMappingsArtifact'))
}

def prepareGeneratedResources = tasks.register('prepareGeneratedResources') {
    def generatedDirectories = [
        layout.buildDirectory.dir('generated/resources/main'),
        layout.buildDirectory.dir('generated/resources/client')
    ]
    outputs.dirs(generatedDirectories)
    doLast {
        generatedDirectories.each { it.get().asFile.mkdirs() }
    }
}

tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
    dependsOn(prepareGeneratedResources)
}
