import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'base'
    id 'maven-publish'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

tasks.register('curseforge', TaskPublishCurseForge)

group = rootProject.group
version = rootProject.version

def sourcesJar = tasks.register('srcJar', Jar) {
    archiveBaseName = "${project.archive}${project.mc_label}-fabric"
    archiveVersion = rootProject.version
    archiveClassifier = 'sources'
    from(rootProject.file('common/src/main/java'))
    from(rootProject.file('fabric/src/main/java'))
}

ext.releaseJarTaskName = 'fabricRemapJar'
ext.releaseArtifactId = 'sekclib-fabric'
ext.releasePlatformName = 'Fabric'
ext.releaseCurseLoaders = ['Fabric']
ext.releaseModrinthLoaders = ['fabric']
ext.releaseAdditionalArtifacts = []
ext.mavenAdditionalArtifacts = [sourcesJar]

apply from: rootProject.file('gradle/platform-publishing.gradle')
