plugins {
    id 'net.neoforged.moddev'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets.main.java.srcDirs = [rootProject.file('common-testmod/src/main/java'), rootProject.file('neoforge-testmod/src/main/java')]
sourceSets.main.resources.srcDirs = [rootProject.file('common-testmod/src/main/resources'), rootProject.file('neoforge-testmod/src/main/resources')]
sourceSets.main.resources.exclude('META-INF/mods.toml')

neoForge {
    version = rootProject.neoforge_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        sekclibtest { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation project(':neoforge')
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
