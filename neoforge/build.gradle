import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.neoforged.moddev'
    id 'base'
    id 'maven-publish'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

group = rootProject.group
version = rootProject.version

tasks.register('curseforge', TaskPublishCurseForge)

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.java.srcDirs = [rootProject.file('common/src/main/java'), rootProject.file('neoforge/src/main/java')]
sourceSets.main.resources.srcDirs = [rootProject.file('common/src/main/resources'), rootProject.file('neoforge/src/main/resources')]

neoForge {
    version = "${rootProject.neoforge_version}"
    runs {
        client { client() }
        server { server() }
    }
    mods {
        sekclib { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }


tasks.named('jar') {
    archiveBaseName = "${rootProject.archive}${rootProject.neoforge_mc_label}-neoforge"
    from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.archive}" } }
}

tasks.named('sourcesJar') {
    archiveBaseName = "${rootProject.archive}${rootProject.neoforge_mc_label}-neoforge"
}

ext.releaseJarTaskName = 'jar'
ext.releaseArtifactId = 'sekclib-neoforge'
ext.releasePlatformName = 'NeoForge'
ext.releaseCurseLoaders = ['NeoForge']
ext.releaseModrinthLoaders = ['neoforge']
ext.releaseAdditionalArtifacts = [tasks.named('sourcesJar')]
ext.mavenAdditionalArtifacts = [tasks.named('sourcesJar')]
ext.game_versions = rootProject.neoforge_game_versions

apply from: rootProject.file('gradle/platform-publishing.gradle')
