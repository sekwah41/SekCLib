import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'base'
    id 'maven-publish'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

tasks.register('curseforge', TaskPublishCurseForge)

group = rootProject.group
version = rootProject.version

def rootForgeJar = rootProject.tasks.named('forgeJar', Jar)

def sourcesJar = tasks.register('srcJar', Jar) {
    archiveBaseName = "${project.archive}${project.mc_label}-forge"
    archiveVersion = rootProject.version
    archiveClassifier = 'sources'
    from(rootProject.file('common/src/main/java'))
    from(rootProject.file('neoforge/src/main/java'))
}

def deobfJar = tasks.register('deobfJar', Jar) {
    dependsOn(rootForgeJar)
    archiveBaseName = "${project.archive}${project.mc_label}-forge"
    archiveVersion = rootProject.version
    archiveClassifier = 'deobf'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(rootForgeJar.get().archiveFile.get().asFile) })
}

ext.releaseJarTaskName = 'forgeRemapJar'
ext.releaseArtifactId = 'sekclib-forge'
ext.releasePlatformName = 'Forge'
ext.releaseCurseLoaders = ['Forge', 'NeoForge']
ext.releaseModrinthLoaders = ['forge', 'neoforge']
ext.releaseAdditionalArtifacts = [sourcesJar, deobfJar]
ext.mavenAdditionalArtifacts = [sourcesJar]

apply from: rootProject.file('gradle/platform-publishing.gradle')
