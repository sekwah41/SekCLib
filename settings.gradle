pluginManagement {
    plugins {
        id 'earth.terrarium.cloche' version providers.gradleProperty('cloche_version').get()
        id 'com.modrinth.minotaur' version '2.10.0'
        id 'net.darkhax.curseforgegradle' version '1.1.28'
        id 'net.neoforged.moddev' version providers.gradleProperty('moddev_version').get()
    }
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Cloche'
            url = 'https://maven.msrandom.net/repository/cloche/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'SekCLib'

include 'fabric'
include 'fabric-testmod'
include 'neoforge'
include 'neoforge-testmod'
